# ====================================================================
# Cloudflare Pages Configuration for Fusion Food Family Lab
# ====================================================================

name = "fusionfood"
compatibility_date = "2024-04-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Static Assets Directory
pages_build_output_dir = "."

# --------------------------------------------------------------------
# Cloudflare D1 Relational Database Binding
# --------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "fusionfood"
database_id = "af600698-1afa-4b2f-8684-82bdf975b554"

# --------------------------------------------------------------------
# Environment Variables & Custom Settings
# --------------------------------------------------------------------
[vars]
ENVIRONMENT = "production"
APP_NAME = "Fusion Food Family Lab"
CORS_ORIGIN = "https://fusionfood.pages.dev"
